{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4>تعديل الكورس: {{ course.title }}</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">عنوان الكورس</label>
                        {{ form.title }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">الوصف</label>
                        {{ form.description }}
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">التصنيف</label>
                            {{ form.category }}
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">السعر</label>
                            {{ form.price }}
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">الحالة</label>
                        {{ form.status }}
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">حفظ التغييرات</button>
                        <a href="{% url 'teacher_courses' %}" class="btn btn-secondary">إلغاء</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
